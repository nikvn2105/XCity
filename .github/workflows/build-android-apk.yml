name: Build XCity Android APK

on:
  push:
    branches: [codex/android-community-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.47f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: XCity
          buildsPath: build
          versioning: None

      - name: Verify APK and signature
        shell: bash
        run: |
          apk=build/Android/XCity.apk
          unzip -tq "$apk"
          unzip -Z1 "$apk" lib/arm64-v8a/libil2cpp.so
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCity-android-apk
          path: build/Android/XCity.apk
          if-no-files-found: error
          retention-days: 30
