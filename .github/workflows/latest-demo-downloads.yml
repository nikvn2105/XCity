name: Update latest demo downloads

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: latest-demo-downloads

jobs:
  update-download-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update demo release headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/latest-demo-downloads.py
