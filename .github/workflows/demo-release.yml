name: Demo release (APK + IPA)

# Push a tag like v0.1.0-demo.3: builds the Android APK and the iOS Xcode project on GitHub, compiles the
# unsigned IPA on a GitHub Mac, then publishes a pre-release with both files and the two download buttons.
# Codemagic is only a fallback: if the Mac job has not started after 20 minutes (macOS queue overloaded)
# or fails, the ipa-fallback job compiles the same Xcode project there. That path needs the repository
# secrets CODEMAGIC_API_TOKEN and CODEMAGIC_APP_ID (see README).

on:
  push:
    tags: ['v*-demo.*']

permissions:
  contents: read

concurrency:
  group: demo-release-${{ github.ref_name }}

jobs:
  ios-project:
    name: Build Unity Xcode project
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check demo tag
        run: bash .github/scripts/demo-version.sh
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-2022.3.47f1-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-2022.3.47f1-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 2022.3.47f1
          buildName: XCity
          buildsPath: build
          versioning: None
      - name: Archive Xcode project with file modes and symlinks
        run: |
          test -f build/iOS/XCity/Unity-iPhone.xcodeproj/project.pbxproj
          tar -cf XCity-XcodeProject.tar -C build/iOS XCity
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: XCity-XcodeProject-${{ github.ref_name }}
          path: XCity-XcodeProject.tar
          if-no-files-found: error
          retention-days: 1

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.47f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: XCity
          buildsPath: build
          versioning: None
      - name: Verify APK and signature
        run: |
          apk=build/Android/XCity.apk
          unzip -tq "$apk"
          unzip -Z1 "$apk" lib/arm64-v8a/libil2cpp.so
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          sudo chown -R "$(id -u):$(id -g)" build/Android
          mv "$apk" "build/Android/XCity-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XCity-apk
          path: build/Android/XCity-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 3

  ipa-mac:
    name: Compile IPA on GitHub Mac
    needs: ios-project
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XCity-XcodeProject-${{ github.ref_name }}
          path: ios-build
      - run: tar -xf ios-build/XCity-XcodeProject.tar -C ios-build
      # ProMotion iPhones cap apps at 60 Hz unless Info.plist opts in; the in-game 120 FPS option needs this.
      - name: Allow 120 Hz on ProMotion iPhones
        run: |
          plist=ios-build/XCity/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$plist" ||
            /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$plist"
      - name: Build unsigned .app with Xcode 16.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          cd ios-build/XCity
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Verify and package unsigned IPA
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$GITHUB_WORKSPACE"/DerivedData/Build/Products/Release-iphoneos/*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::Expected exactly one Release-iphoneos app"; exit 1; }
          app="${apps[0]}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.nikstudiovn.xcity
          lipo "$app/Frameworks/UnityFramework.framework/UnityFramework" -verify_arch arm64
          mkdir -p ipa-out/Payload
          ditto "$app" "ipa-out/Payload/$(basename "$app")"
          ditto -c -k --keepParent ipa-out/Payload "XCity-${GITHUB_REF_NAME}-unsigned.ipa"
          unzip -tq "XCity-${GITHUB_REF_NAME}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: XCity-ipa-mac
          path: XCity-${{ github.ref_name }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 3

  ipa-fallback:
    name: IPA fallback (Codemagic when the Mac queue is stuck)
    needs: ios-project
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wait for the GitHub Mac job, start Codemagic if it is stuck or failed
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          CM_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_APP: ${{ secrets.CODEMAGIC_APP_ID }}
          ARTIFACT_ID: ${{ needs.ios-project.outputs.artifact-id }}
        run: |
          set -euo pipefail
          job() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Compile IPA on GitHub Mac") | "\(.status) \(.conclusion)"'; }
          queued_for=0
          while true; do
            read -r status conclusion <<<"$(job)"
            echo "Mac job: $status $conclusion"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then echo "used=mac" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "::warning::GitHub Mac job $conclusion; falling back to Codemagic"; break
            fi
            if [ -z "$status" ] || [ "$status" = queued ] || [ "$status" = waiting ] || [ "$status" = pending ]; then
              queued_for=$((queued_for + 30))
              if [ $queued_for -ge 1200 ]; then echo "::warning::GitHub Mac queue stuck for 20 min; falling back to Codemagic"; break; fi
            fi
            sleep 30
          done
          echo "used=codemagic" >> "$GITHUB_OUTPUT"
          if [ -z "$CM_TOKEN" ] || [ -z "$CM_APP" ]; then
            echo "::error::Fallback needs the CODEMAGIC_API_TOKEN and CODEMAGIC_APP_ID repository secrets"; exit 1
          fi
          body=$(jq -n --arg app "$CM_APP" --arg tag "$GITHUB_REF_NAME" --arg id "$ARTIFACT_ID" \
            '{appId: $app, workflowId: "ios-unsigned-ipa", tag: $tag,
              environment: {variables: {XCODE_ARTIFACT_ID: $id, DEMO_VERSION: $tag}}}')
          build=$(curl -fsS -X POST https://api.codemagic.io/builds -H "x-auth-token: $CM_TOKEN" \
            -H 'Content-Type: application/json' -d "$body" | jq -r .buildId)
          echo "Codemagic build: https://codemagic.io/app/$CM_APP/build/$build"
          status=""
          for i in $(seq 1 140); do
            sleep 30
            json=$(curl -fsS -H "x-auth-token: $CM_TOKEN" "https://api.codemagic.io/builds/$build")
            status=$(jq -r .build.status <<<"$json")
            echo "Codemagic: $status"
            case "$status" in
              finished) break ;;
              failed|canceled|timeout|skipped) echo "::error::Codemagic build $status"; exit 1 ;;
            esac
          done
          [ "$status" = finished ] || { echo "::error::Codemagic build did not finish in time"; exit 1; }
          url=$(jq -r --arg name "XCity-${GITHUB_REF_NAME}-unsigned.ipa" \
            '.build.artefacts[] | select(.name == $name) | .url' <<<"$json")
          [ -n "$url" ] || { echo "::error::No IPA in the Codemagic artefacts"; exit 1; }
          curl -fsSL -H "x-auth-token: $CM_TOKEN" -o "XCity-${GITHUB_REF_NAME}-unsigned.ipa" "$url"
          unzip -tq "XCity-${GITHUB_REF_NAME}-unsigned.ipa"
      - if: steps.watch.outputs.used == 'codemagic'
        uses: actions/upload-artifact@v4
        with:
          name: XCity-ipa-codemagic
          path: XCity-${{ github.ref_name }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      # The ~200 MB Xcode project only bridges the build machines; drop it once an IPA is safe.
      - name: Delete the Xcode project artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.ios-project.outputs.artifact-id }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" || true

  release:
    name: Publish pre-release
    needs: [android, ipa-fallback]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XCity-apk
          path: out
      # Whichever machine made the IPA (same file name either way).
      - uses: actions/download-artifact@v4
        with:
          pattern: XCity-ipa-*
          path: out
          merge-multiple: true
      - name: Create the pre-release with both files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="out/XCity-${GITHUB_REF_NAME}.apk"
          ipa="out/XCity-${GITHUB_REF_NAME}-unsigned.ipa"
          test -f "$apk" && test -f "$ipa"
          # A release made by hand on GitHub (draft or published) is reused instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$ipa" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --title "XCity $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$ipa" --prerelease \
              --title "XCity $GITHUB_REF_NAME" --notes "IPA cần được ký (ví dụ xsign) trước khi cài lên iPhone."
          fi
      # Releases made with this token do not trigger other workflows, so add the buttons here.
      - name: Add the download buttons
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/latest-demo-downloads.py
      # A Mac job still waiting in an overloaded queue would keep this run open for a day: stop it.
      - name: Cancel a still-queued Mac job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Compile IPA on GitHub Mac") | .status')
          if [ "$status" != completed ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"; fi
